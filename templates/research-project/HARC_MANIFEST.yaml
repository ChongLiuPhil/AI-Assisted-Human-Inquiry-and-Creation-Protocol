harc:
  protocol_name: "Human–AI Research Collaboration Protocol"
  adopted_protocol_version: "UNRESOLVED"
  adopted_protocol_commit: "UNRESOLVED"
  canonical_language: "zh-CN"
  mirror_language: "en"

  bootstrap:
    canonical: "START_HERE.zh-CN.md"
    mirror: "START_HERE.md"
    bootstrap_prompt: "BOOTSTRAP_PROMPT.zh-CN.md"
    onboarding_report_template: "ONBOARDING_REPORT_TEMPLATE.zh-CN.md"
    session_context_bootstrap: "SESSION_CONTEXT_BOOTSTRAP.zh-CN.md"
    context_interface: "HARC_CONTEXT_INTERFACE.yaml"
    agent_contract:
      canonical: "AGENTS.zh-CN.md"
      mirror: "AGENTS.md"

  required_read_order:
    - "HARC_MANIFEST.yaml"
    - "HARC_CONTEXT_INTERFACE.yaml"
    - "START_HERE.zh-CN.md"
    - "BOOTSTRAP_PROMPT.zh-CN.md"
    - "SESSION_CONTEXT_BOOTSTRAP.zh-CN.md"
    - "AGENTS.zh-CN.md"
    - "docs/working-memory.zh-CN.md"

  onboarding_required_roles:
    - "working_memory"
    - "content_core"
    - "form_core"
    - "decision_log"
    - "framework_status"
    - "latest_approved_framework_if_any"
    - "working_argument_map"


  state:
    working_memory: "docs/working-memory.zh-CN.md"
    legacy_clarification_pointer: "docs/clarification-register.zh-CN.md"
    content_core: "core/CONTENT_CORE.zh-CN.md"
    form_core: "core/FORM_CORE.zh-CN.md"
    decision_log: "core/DECISION_LOG.zh-CN.md"
    framework_status: "docs/framework-status.zh-CN.md"
    working_argument_map: "docs/argument-map.zh-CN.md"
    approved_framework_directory: "docs/frameworks/"

  onboarding_handshake:
    required_before_substantive_work: true
    report_fields:
      - "protocol_state"
      - "human_confirmed_state"
      - "form_state"
      - "working_memory_status"
      - "current_objective"
      - "active_tasks"
      - "blockers"
      - "pending_human_decisions"
      - "working_framework_status"
      - "approved_framework_status"
      - "artifact_status"
      - "synchronization_defects"
      - "permitted_next_action"
      - "repository_context_active"

  invariants:
    - "Repository state outranks chat memory."
    - "AI proposals are not human commitments."
    - "Working Memory is parallel operational state, not Layer 1.5."
    - "Working Memory must be updated after substantial work cycles and before handoff."
    - "High-impact uncertainty enters Working Memory as a Clarification item."
    - "Resolved Working Memory items are promoted into the appropriate long-term memory destination."
    - "Blocking clarifications must be resolved or explicitly deferred before Framework Approval."
    - "Human decisions propagate upstream-first."
    - "Working Framework is not Approved Framework."
    - "Derived artifacts remain provisional until approval."
    - "Chinese canonical and English mirror must remain synchronized."
    - "GitHub is the sole authoritative project-state source."
    - "Session copies are non-authoritative transient cache."
    - "Read latest canonical state before high-impact actions and writes."
    - "Invalidate touched cache after repository writes."
