harc:
  protocol_name: "Human–AI Research Collaboration Protocol"
  protocol_version: "0.2.0-draft"
  repository_role: "HARC protocol development repository"
  canonical_language: "zh-CN"
  mirror_language: "en"
  bootstrap:
    canonical: "START_HERE.zh-CN.md"
    mirror: "START_HERE.md"
    bootstrap_prompt: "BOOTSTRAP_PROMPT.zh-CN.md"
    onboarding_report_template: "ONBOARDING_REPORT_TEMPLATE.zh-CN.md"
    onboarding_handshake_protocol: "protocol/ONBOARDING_HANDSHAKE.zh-CN.md"
    session_context_bootstrap: "SESSION_CONTEXT_BOOTSTRAP.zh-CN.md"
    context_interface: "HARC_CONTEXT_INTERFACE.yaml"
    agent_contract:
      canonical: "AGENTS.zh-CN.md"
      mirror: "AGENTS.md"

  required_read_order:
    - "HARC_MANIFEST.yaml"
    - "HARC_CONTEXT_INTERFACE.yaml"
    - "START_HERE.zh-CN.md"
    - "BOOTSTRAP_PROMPT.zh-CN.md"
    - "SESSION_CONTEXT_BOOTSTRAP.zh-CN.md"
    - "AGENTS.zh-CN.md"
    - "docs/working-memory.zh-CN.md"
    - "docs/working-memory/current-focus.zh-CN.md"
    - "docs/working-memory/task-plan.zh-CN.md"
    - "protocol/ONBOARDING_HANDSHAKE.zh-CN.md"
    - "core/PROTOCOL_CORE.zh-CN.md"
    - "core/DECISION_LOG.zh-CN.md"

  onboarding_required_roles:
    - "working_memory_index"
    - "working_memory_current_focus"
    - "working_memory_task_plan"
    - "protocol_core"
    - "decision_log"
    - "methodology_article.framework_status"

  protocol_state:
    protocol_core: "core/PROTOCOL_CORE.zh-CN.md"
    decision_log: "core/DECISION_LOG.zh-CN.md"
    specification: "protocol/SPECIFICATION.zh-CN.md"
    persistent_memory: "protocol/PERSISTENT_MEMORY.zh-CN.md"
    working_memory_protocol: "protocol/WORKING_MEMORY.zh-CN.md"
    repository_context_interface: "protocol/REPOSITORY_CONTEXT_INTERFACE.zh-CN.md"
    onboarding_handshake: "protocol/ONBOARDING_HANDSHAKE.zh-CN.md"
    clarification_protocol: "protocol/CLARIFICATION_REGISTER.zh-CN.md"
    working_memory: "docs/working-memory.zh-CN.md"
    working_memory_index: "docs/working-memory.zh-CN.md"
    working_memory_current_focus: "docs/working-memory/current-focus.zh-CN.md"
    working_memory_task_plan: "docs/working-memory/task-plan.zh-CN.md"
    working_memory_work_log: "docs/working-memory/work-log.zh-CN.md"
    legacy_clarification_pointer: "docs/clarification-register.zh-CN.md"
    framework_approval: "protocol/FRAMEWORK_APPROVAL.zh-CN.md"
    routing: "protocol/FORM_CONTENT_ROUTING.zh-CN.md"
    bilingual_sync: "protocol/BILINGUAL_SYNC.zh-CN.md"

  methodology_article:
    required_read_order:
      - "docs/working-memory.zh-CN.md"
      - "docs/working-memory/current-focus.zh-CN.md"
      - "docs/working-memory/task-plan.zh-CN.md"
      - "paper/METHODOLOGY_ARTICLE_CONTENT_CORE.zh-CN.md"
      - "paper/METHODOLOGY_ARTICLE_FORM_CORE.zh-CN.md"
      - "paper/METHODOLOGY_ARTICLE_FRAMEWORK_STATUS.zh-CN.md"
      - "LATEST_APPROVED_FRAMEWORK_IF_ANY"
      - "paper/METHODOLOGY_ARTICLE_ARGUMENT_MAP.zh-CN.md"
      - "evidence/METHODOLOGY_SOURCES.zh-CN.md"
      - "paper/methodology-references.bib"
      - "paper/METHODOLOGY_ARTICLE.zh-CN.md"
      - "paper/METHODOLOGY_ARTICLE.en.md"
    content_core: "paper/METHODOLOGY_ARTICLE_CONTENT_CORE.zh-CN.md"
    form_core: "paper/METHODOLOGY_ARTICLE_FORM_CORE.zh-CN.md"
    working_memory: "docs/working-memory.zh-CN.md"
    working_memory_index: "docs/working-memory.zh-CN.md"
    working_memory_current_focus: "docs/working-memory/current-focus.zh-CN.md"
    working_memory_task_plan: "docs/working-memory/task-plan.zh-CN.md"
    working_memory_work_log: "docs/working-memory/work-log.zh-CN.md"
    legacy_clarification_pointer: "docs/clarification-register.zh-CN.md"
    framework_status: "paper/METHODOLOGY_ARTICLE_FRAMEWORK_STATUS.zh-CN.md"
    working_argument_map: "paper/METHODOLOGY_ARTICLE_ARGUMENT_MAP.zh-CN.md"
    evidence: "evidence/METHODOLOGY_SOURCES.zh-CN.md"
    artifact:
      canonical: "paper/METHODOLOGY_ARTICLE.zh-CN.md"
      mirror: "paper/METHODOLOGY_ARTICLE.en.md"
    bibliography: "paper/methodology-references.bib"

  onboarding_handshake:
    required_before_substantive_work: true
    report_fields:
      - "protocol_state"
      - "human_confirmed_state"
      - "form_state"
      - "working_memory_status"
      - "current_focus"
      - "current_objective"
      - "active_tasks"
      - "blockers"
      - "pending_human_decisions"
      - "working_framework_status"
      - "approved_framework_status"
      - "artifact_status"
      - "synchronization_defects"
      - "permitted_next_action"
      - "repository_context_active"

  invariants:
    - "Repository state outranks chat memory."
    - "Chinese canonical outranks English mirror."
    - "AI proposals are not human commitments."
    - "Working Memory is parallel operational state, not Layer 1.5."
    - "Working Memory logical roles may map to one or multiple files."
    - "Current Focus and Task Plan are default operational resume state."
    - "Work Log is human-retrospective and not default AI onboarding context."
    - "Working Memory must be updated after substantial work cycles and before handoff."
    - "High-impact uncertainty must enter Working Memory as a Clarification item."
    - "Resolved Working Memory items must be promoted into the appropriate long-term memory destination."
    - "Blocking clarifications must be resolved or explicitly deferred before Framework Approval."
    - "Human decisions propagate upstream-first."
    - "Working Framework is not Approved Framework."
    - "Derived artifacts remain provisional until the applicable approval gate is complete."
    - "Every substantive Chinese edit must synchronize the English mirror in the same work cycle."
    - "GitHub is the sole authoritative project-state source."
    - "Session copies are non-authoritative transient cache."
    - "Read latest canonical state before high-impact actions and writes."
    - "Invalidate touched cache after repository writes."
