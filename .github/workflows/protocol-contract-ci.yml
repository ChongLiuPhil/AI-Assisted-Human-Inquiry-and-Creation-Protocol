name: Protocol Contract CI

on:
  pull_request:
    paths:
      - "protocol/SPECIFICATION*.md"
      - "core/PROTOCOL_CORE*.md"
      - "core/DECISION_LOG*.md"
      - "AGENTS*.md"
      - "templates/research-project/**"
      - "templates/template-manifest.yaml"
      - "docs/TEMPLATE_ADOPTION_AND_UPGRADE*.md"
      - "tools/check_protocol_contract.py"
      - "tools/check_template_manifest.py"
      - "requirements-validation.txt"
      - ".github/workflows/protocol-contract-ci.yml"
  push:
    branches: [main]
    paths:
      - "protocol/SPECIFICATION*.md"
      - "core/PROTOCOL_CORE*.md"
      - "core/DECISION_LOG*.md"
      - "AGENTS*.md"
      - "templates/research-project/**"
      - "templates/template-manifest.yaml"
      - "docs/TEMPLATE_ADOPTION_AND_UPGRADE*.md"
      - "tools/check_protocol_contract.py"
      - "tools/check_template_manifest.py"
      - "requirements-validation.txt"
      - ".github/workflows/protocol-contract-ci.yml"

permissions:
  contents: read

jobs:
  validate-protocol-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-validation.txt
      - name: Validate AHICP protocol contract
        run: python tools/check_protocol_contract.py
      - name: Validate installable template profiles
        run: python tools/check_template_manifest.py
