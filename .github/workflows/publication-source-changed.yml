name: Publication source changed
on:
  push:
permissions: {}
jobs:
  changed:
    if: github.repository == 'ChongLiuPhil/AI-Assisted-Human-Inquiry-and-Creation-Protocol' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Default-branch publication source changed; notification follows in a separate credential-bearing workflow.'
