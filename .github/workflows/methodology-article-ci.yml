name: Methodology Article CI

on:
  pull_request:
    paths:
      - "paper/METHODOLOGY_ARTICLE*.md"
      - "paper/methodology-references.bib"
      - "evidence/METHODOLOGY_SOURCES*.md"
      - "docs/working-memory/**"
      - "core/DECISION_LOG*.md"
      - "tools/check_methodology_article.py"
      - ".github/workflows/methodology-article-ci.yml"
  push:
    branches: [main]
    paths:
      - "paper/METHODOLOGY_ARTICLE*.md"
      - "paper/methodology-references.bib"
      - "evidence/METHODOLOGY_SOURCES*.md"
      - "docs/working-memory/**"
      - "core/DECISION_LOG*.md"
      - "tools/check_methodology_article.py"
      - ".github/workflows/methodology-article-ci.yml"

permissions:
  contents: read

jobs:
  validate-methodology-article:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate methodology article state
        run: python tools/check_methodology_article.py
